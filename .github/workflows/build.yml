name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.11"
            platform: darwin
          - os: ubuntu-latest
            python-version: "3.11"
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install litert-lm and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install litert-lm

      - name: Get litert_lm path
        id: litert-path
        run: |
          LITERT_PATH=$(python -c "import litert_lm, os; print(os.path.dirname(litert_lm.__file__))")
          echo "path=$LITERT_PATH" >> $GITHUB_OUTPUT

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev portaudio19-dev pkg-config

      - name: Install system deps (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install curl portaudio

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLITERT_LM_DIR=${{ steps.litert-path.outputs.path }}

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu 2>/dev/null || nproc)

      - name: Run unit tests
        run: |
          g++ -std=c++20 -o build/test_json_utils tests/test_json_utils.cpp 2>&1
          ./build/test_json_utils 2>&1 | tail -3

      - name: Package release tarball
        id: package
        run: |
          mkdir -p dist
          cp build/tiny-skylark dist/
          ARCH_NAME=$(uname -m)
          if [[ "$ARCH_NAME" == x86_64 ]]; then
            ARCH_SUFFIX=x64
          else
            ARCH_SUFFIX=arm64
          fi
          echo "arch=$ARCH_SUFFIX" >> $GITHUB_OUTPUT
          tar -czf dist/tiny-skylark-${{ matrix.platform }}-${ARCH_SUFFIX}.tar.gz -C dist tiny-skylark

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: tiny-skylark-${{ matrix.platform }}-${{ steps.package.outputs.arch }}
          path: dist/tiny-skylark-${{ matrix.platform }}-${{ steps.package.outputs.arch }}.tar.gz
          retention-days: 30

