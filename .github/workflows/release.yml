name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.11"
            platform: darwin
          - os: ubuntu-latest
            python-version: "3.11"
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install litert-lm
        run: python -m pip install --upgrade pip litert-lm

      - name: Get litert_lm path
        id: litert-path
        run: |
          LITERT_PATH=$(python -c "import litert_lm, os; print(os.path.dirname(litert_lm.__file__))")
          echo "path=$LITERT_PATH" >> $GITHUB_OUTPUT

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev portaudio19-dev pkg-config

      - name: Install system deps (macOS)
        if: matrix.platform == 'darwin'
        run: brew install curl portaudio

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLITERT_LM_DIR=${{ steps.litert-path.outputs.path }}

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu 2>/dev/null || nproc)

      - name: Package tarball
        run: |
          mkdir -p dist
          cp build/bb dist/
          # Bundle litert-lm library alongside the binary
          if [[ "${{ matrix.platform }}" == darwin ]]; then
            cp "${{ steps.litert-path.outputs.path }}/liblitert-lm.dylib" dist/
            ln -sf liblitert-lm.dylib dist/liblitert-lm.so
            TARBALL_FILES="bb liblitert-lm.dylib liblitert-lm.so"
          else
            cp "${{ steps.litert-path.outputs.path }}/liblitert-lm.so" dist/
            TARBALL_FILES="bb liblitert-lm.so"
          fi
          ARCH_NAME=$(uname -m)
          if [[ "$ARCH_NAME" == x86_64 ]]; then
            ARCH_SUFFIX=x64
          else
            ARCH_SUFFIX=arm64
          fi
          PLATFORM_NAME=${{ matrix.platform }}
          tar -czf dist/tiny-habibi-${PLATFORM_NAME}-${ARCH_SUFFIX}.tar.gz -C dist ${TARBALL_FILES}

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ${{ github.ref_name }} --repo ${{ github.repository }} 2>/dev/null; then
            gh release create ${{ github.ref_name }} \
              --title "tiny-habibi v0.1.0" \
              --notes "tiny-habibi v0.1.0 — initial release" \
              --repo ${{ github.repository }}
          fi
          ARCH_NAME=$(uname -m)
          if [[ "$ARCH_NAME" == x86_64 ]]; then
            ARCH_SUFFIX=x64
          else
            ARCH_SUFFIX=arm64
          fi
          PLATFORM_NAME=${{ matrix.platform }}
          gh release upload ${{ github.ref_name }} \
            "dist/tiny-habibi-${PLATFORM_NAME}-${ARCH_SUFFIX}.tar.gz" \
            --repo ${{ github.repository }}
